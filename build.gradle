plugins {
    id 'java'
    id 'war'
    id 'application'
}

group = 'com.healix'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // Servlet & JSP API
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    compileOnly 'jakarta.servlet.jsp:jakarta.servlet.jsp-api:3.1.0'

    // Database Driver (PostgreSQL JDBC)
    implementation 'org.postgresql:postgresql:42.7.3'

    // Connection Pooling (HikariCP)
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // BCrypt for Password Hashing
    implementation 'org.mindrot:jbcrypt:0.4'

    // Embedded Tomcat for 1-click execution
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.24'
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper:10.1.24'
    implementation 'org.apache.tomcat:tomcat-jasper:10.1.24'
    implementation 'org.apache.tomcat:tomcat-jasper-el:10.1.24'
    implementation 'org.apache.tomcat:tomcat-jsp-api:10.1.24'

    // JSTL for modern JSP templating
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.healix.server.MainServer'
}

test {
    useJUnitPlatform()
}
